# nim.cfg

# Tell Nim to use the Clang toolchain template
cc = clang

# Overrides for the C backend
clang.exe = "zcc.bat"
clang.linkerexe = "zcc.bat"

# Overrides for the C++ backend (if you use `nim cpp`)
clang.cpp.exe = "zxx.bat"
clang.cpp.linkerexe = "zxx.bat"

@if windows and amd64:
  @if amd64:
    passC = "-target x86_64-windows-gnu"
    passL = "-target x86_64-windows-gnu"
  @end
@elif linux:
  @if amd64:
    passC = "-target x86_64-linux-musl"
    passL = "-target x86_64-linux-musl"
  @elif arm64:
    passC = "-target aarch64-linux-musl"
    passL = "-target aarch64-linux-musl"
  @end
@end
