#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template = "{{ .Folder }}"
final_space = true
version = 2.0

[[blocks]]
  alignment = "left"
  type = "prompt"

  [[blocks.segments]]
    background = "#21c7a8"
    foreground = "#011627"
    leading_diamond = "\u256d\u2500\ue0b6"
    style = "diamond"
    template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}}  "
    trailing_diamond = "\ue0b0"
    type = "os"
    [blocks.segments.properties]
      windows = "\ue62a"

  [[blocks.segments]]
    background = "#ef5350"
    foreground = "#ffeb95"
    powerline_symbol = "\ue0b0"
    style = "powerline"
    template = " \uf292 "
    type = "root"

  [[blocks.segments]]
    background = "#82AAFF"
    foreground = "#011627"
    powerline_symbol = "\ue0b0"
    style = "powerline"
    template = "{{ path .Path .Location }}"
    type = "path"
    [blocks.segments.properties]
      folder_icon = "\uf07c "
      folder_separator_icon = "<#011627>\ue0b1</> "
      home_icon = " \ueb06 "
      style = "agnoster"

  [[blocks.segments]]
    background = "#addb67"
    background_templates = ["{{ if or (.Working.Changed) (.Staging.Changed) }}#e4cf6a{{ end }}", "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f78c6c{{ end }}", "{{ if gt .Ahead 0 }}#C792EA{{ end }}", "{{ if gt .Behind 0 }}#c792ea{{ end }}"]
    foreground = "#011627"
    powerline_symbol = "\ue0b0"
    style = "powerline"
    template = " {{ url .UpstreamIcon .UpstreamURL }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \uf044 {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uf046 {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} \ueb4b {{ .StashCount }}{{ end }} "
    type = "git"
    [blocks.segments.properties]
      branch_icon = "\ue725 "
      fetch_stash_count = true
      fetch_status = true
      fetch_upstream_icon = true
      fetch_worktree_count = true

  [[blocks.segments]]
    background = "#575656"
    foreground = "#d6deeb"
    leading_diamond = "<transparent,#575656>\ue0b0</>"
    style = "diamond"
    template = " {{ .FormattedMs }}"
    trailing_diamond = "\ue0b4"
    type = "executiontime"
    [blocks.segments.properties]
      style = "roundrock"
      threshold = 0.0

[[blocks]]
  alignment = "right"
  overflow = "break"
  type = "prompt"

  [[blocks.segments]]
    background = "#d6deeb"
    foreground = "#011627"
    leading_diamond = "\ue0b6"
    style = "diamond"
    template = "\uf489  {{ .Name }} "
    trailing_diamond = "<transparent,#d6deeb>\ue0b2</>"
    type = "shell"

  [[blocks.segments]]
    background = "#8f43f3"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue266 {{ round .PhysicalPercentUsed .Precision }}% "
    trailing_diamond = "<transparent,#8f43f3>\ue0b2</>"
    type = "sysinfo"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#ce092f"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue753 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "angular"

  [[blocks.segments]]
    background = "#565656"
    foreground = "#faa029"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue7ad {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} "
    trailing_diamond = "<transparent,#565656>\ue0b2</>"
    type = "aws"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#337bb6"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ufd03 {{ .EnvironmentName }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "az"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#5398c2"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\uf104<#f5bf45>\uf0e7</>\uf105 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "azfunc"

  [[blocks.segments]]
    background = "#5a7a94"
    foreground = "#100e23"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue311  cds {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#5a7a94>\ue0b2</>"
    type = "cds"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#000000"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue370 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#000000>\ue0b2</>"
    type = "crystal"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#1d5185"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\uf40a  cf {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "cf"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#1d5185"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\uf40a {{if .Org }}{{ .Org }}{{ end }}{{ if .Space }}/{{ .Space }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "cftarget"

  [[blocks.segments]]
    background = "#d2d2d2"
    foreground = "#01a300"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "<#2829b2>\ue61e</> <#be1818>\ue61d</>  cmake {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#d2d2d2>\ue0b2</>"
    type = "cmake"

  [[blocks.segments]]
    background = "#e1e8e9"
    foreground = "#055b9c"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue798 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#e1e8e9>\ue0b2</>"
    type = "dart"

  [[blocks.segments]]
    background = "#0e0e0e"
    foreground = "#0d6da8"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue77f  {{ if .Unsupported }}\uf071{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#0e0e0e>\ue0b2</>"
    type = "dotnet"

  [[blocks.segments]]
    background = "#06A4CE"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue28e {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#06A4CE>\ue0b2</>"
    type = "flutter"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#06aad5"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue626 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "go"

  [[blocks.segments]]
    background = "#100e23"
    foreground = "#906cff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue61f {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#100e23>\ue0b2</>"
    type = "haskell"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#ec2729"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue738 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "java"

  [[blocks.segments]]
    background = "#945bb3"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "<#ca3c34>\ue624</> {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#945bb3>\ue0b2</>"
    type = "julia"

  [[blocks.segments]]
    background = "#906cff"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "K {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#906cff>\ue0b2</>"
    type = "kotlin"

  [[blocks.segments]]
    background = "#316ce4"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\uf308 {{.Context}} :: {{if .Namespace}}{{.Namespace}}{{else}}default{{end}} "
    trailing_diamond = "<transparent,#316ce4>\ue0b2</>"
    type = "kubectl"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#000081"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue620 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "lua"

  [[blocks.segments]]
    background = "#303030"
    foreground = "#3C873A"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue718 {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
    trailing_diamond = "<transparent,#303030>\ue0b2</>"
    type = "node"
    [blocks.segments.properties]
      fetch_package_manager = true
      npm_icon = "<#cc3a3a>\ue71e</> "
      yarn_icon = "<#348cba>\ue6a7</> "

  [[blocks.segments]]
    background = "#6488c0"
    foreground = "#1e293b"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "Nx {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#6488c0>\ue0b2</>"
    type = "nx"

  [[blocks.segments]]
    background = "#41436d"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue769 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#41436d>\ue0b2</>"
    type = "perl"

  [[blocks.segments]]
    background = "#787CB5"
    foreground = "#000000"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue73d {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#787CB5>\ue0b2</>"
    type = "php"

  [[blocks.segments]]
    background = "#306998"
    foreground = "#FFE873"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue235  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}"
    trailing_diamond = "<transparent,#306998>\ue0b2</>"
    type = "python"

  [[blocks.segments]]
    background = "#b9bbbf"
    foreground = "#1c68bd"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "R {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#b9bbbf>\ue0b2</>"
    type = "r"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#9c1006"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue791 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "ruby"

  [[blocks.segments]]
    background = "#ffffff"
    foreground = "#000000"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue7a8 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#ffffff>\ue0b2</>"
    type = "rust"

  [[blocks.segments]]
    background = "#fe562e"
    foreground = "#ffffff"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue755 {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} "
    trailing_diamond = "<transparent,#fe562e>\ue0b2</>"
    type = "swift"

  [[blocks.segments]]
    background = "#234d70"
    foreground = "#d6deeb"
    leading_diamond = "\ue0b2"
    style = "diamond"
    template = "\ue641 {{ .CurrentDate | date .Format }}"
    trailing_diamond = "\ue0b4"
    type = "time"
    [blocks.segments.properties]
      time_format = "15:04:05"

[[blocks]]
  alignment = "left"
  newline = true
  type = "prompt"

  [[blocks.segments]]
    foreground = "#21c7a8"
    style = "plain"
    template = "\u2570\u2500"
    type = "text"

  [[blocks.segments]]
    background = "#1DB954"
    foreground = "#011627"
    leading_diamond = "\ue0b6"
    style = "diamond"
    template = " {{ .Icon }}{{ if ne .Status \"stopped\" }}{{ .Artist }} ~ {{ .Track }}{{ end }} "
    trailing_diamond = "\ue0c6 "
    type = "spotify"
    [blocks.segments.properties]
      playing_icon = "\uf1bc "

  [[blocks.segments]]
    foreground = "#22da6e"
    foreground_templates = ["{{ if gt .Code 0 }}#ef5350{{ end }}"]
    style = "plain"
    template = "\ue285\ue285"
    type = "status"
    [blocks.segments.properties]
      always_enabled = true

[transient_prompt]
  background = "transparent"
  foreground = "#d6deeb"
  template = "\ue285 "

