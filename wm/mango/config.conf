# Autostarts
exec = kanshi
exec = awww-daemon --format xrgb
exec = qs -c noctalia-shell --no-duplicate
exec-once = fcitx5 -d
exec-once = vicinae server
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-kde-authentication-agent-1 # Note: On NixOS this path might differ; check your Polkit package
exec-once = synology-drive
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = systemctl --user import-environment
exec-once = hash dbus-update-activation-environment 2>/dev/null
exec-once = dbus-update-activation-environment --systemd
exec-once = hypridle

# environment variables
env=QT_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=SDL_IM_MODULE,fcitx
env=GDK_SCALE,1.0
env=GDK_DPI_SCALE,0.8
env=HYPRCURSOR_SIZE,32
env=XCURSOR_SIZE,32
env=QT_CURSOR_SIZE,32
env=GRIM_DEFAULT_DIR,${home}/Documents/Screenshots
env=GTK_THEME,Adwaita:dark
env=QT_STYLE_OVERRIDE,ib.mkForce Adwaita-Dark
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,niri
env=SDL_VIDEODRIVER,wayland
env=WLR_NO_HARDWARE_CURSORS,1
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_DISABLE_RDD_SANDBOX,1
env=MOZ_ENABLE_WAYLAND,1

# Inputs
sloppyfocus                = 0  # disable focus follows the mouse cursor
trackpad_natural_scrolling = 1

# Layout
# Scroller Layout
scroller_structs            = 7
scroller_default_proportion = 0.5
scroller_proportion_preset  = 0.5,1.0

# Overview
enable_hotarea = 0

# Tag Rules
# Set layout for specific tags
tagrule = id:1, layout_name:scroller
tagrule = id:2, layout_name:scroller
tagrule = id:3, layout_name:scroller
tagrule = id:4, layout_name:scroller
tagrule = id:5, layout_name:scroller
tagrule = id:6, layout_name:scroller
tagrule = id:7, layout_name:scroller
tagrule = id:8, layout_name:scroller
tagrule = id:9, layout_name:scroller

# Themes
# border settings
borderpx  = 3              # Border width in pixels
gappih	  = 7              # Horizontal inner gap (between windows).
gappiv	  = 7              # Vertical inner gap.
gappoh	  = 7              # Horizontal outer gap (between windows and screen edges).
gappov	  = 7              # Vertical outer gap.
bordercolor = 0x182545ff
focuscolor  = 0x01ccffff

# cursor theme
cursor_size  = 32
cursor_theme = LilpaTheme

# Keybinds
## Keybind Syntax
## Key bindings follow this format:
## 
## 
## bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
## - Modifiers: SUPER, CTRL, ALT, SHIFT, NONE (combine with +).
## - Key: Key name (from xev or wev) or code (e.g., code:24 for q).
## - Flags
## l: Works even when screen is locked.
## s: Uses keysym instead of keycode.
## r: Triggers on key release instead of press.
## p: Pass key event to client.
##
## Touchpad Gestures
## gesturebind=MODIFIERS,DIRECTION,FINGERS,COMMAND,PARAMETERS
## - Direction: up, down, left, right
## - Fingers: 3 or 4

# main app binds
bind = SUPER            , Return, spawn_shell, ghostty
bind = SUPER+SHIFT      , Return, spawn_shell, zen-browser
bind = SUPER+CTRL+SHIFT , Return, spawn_shell, zen-browser --private-window
bind = SUPER            , Space , spawn_shell, vicinae toggle
bind = SUPER            , E     , spawn_shell, nemo
bind = SUPER+SHIFT      , Q     , killclient
bind = SUPER+SHIFT      , X     , spawn_shell, /home/almagest/.config/alma-scripts/LockScreen.sh
bind = SUPER+SHIFT      , R     , reload_config

# screenshots
bind = SUPER+SHIFT     , P, spawn_shell, eens area

# window state
bind = SUPER      , F, togglefloating
bind = SUPER+SHIFT, F, togglefullscreen
bind = SUPER      , M, toggleglobal

# Set specific layout
bind = SUPER, T, setlayout, tile
bind = SUPER, S, setlayout, scroller

# focus
bind = SUPER, left , focusdir, left
bind = SUPER, right, focusdir, right
bind = SUPER, up   , focusdir, up
bind = SUPER, down , focusdir, down

# move/swap tiled window positions
bind = SUPER+SHIFT, left , exchange_client, left
bind = SUPER+SHIFT, right, exchange_client, right
bind = SUPER+SHIFT, up   , exchange_client, up
bind = SUPER+SHIFT, down , exchange_client, down

# focus monitor
bind = SUPER+CTRL, left , focusmon, left
bind = SUPER+CTRL, right, focusmon, right
bind = SUPER+CTRL, up   , focusmon, up
bind = SUPER+CTRL, down , focusmon, down

# move window into other monitor
bind = SUPER+CTRL+SHIFT, left , tagmon, left
bind = SUPER+CTRL+SHIFT, right, tagmon, right
bind = SUPER+CTRL+SHIFT, up   , tagmon, up
bind = SUPER+CTRL+SHIFT, down , tagmon, down

# move workspaces
bind = SUPER, 1, view, 1
bind = SUPER, 2, view, 2
bind = SUPER, 3, view, 3
bind = SUPER, 4, view, 4
bind = SUPER, 5, view, 5
bind = SUPER, 6, view, 6
bind = SUPER, 7, view, 7
bind = SUPER, 8, view, 8
bind = SUPER, 9, view, 9

# place windows into workspaces
bind = SUPER+SHIFT, 1, tag, 1
bind = SUPER+SHIFT, 2, tag, 2
bind = SUPER+SHIFT, 3, tag, 3
bind = SUPER+SHIFT, 4, tag, 4
bind = SUPER+SHIFT, 5, tag, 5
bind = SUPER+SHIFT, 6, tag, 6
bind = SUPER+SHIFT, 7, tag, 7
bind = SUPER+SHIFT, 8, tag, 8
bind = SUPER+SHIFT, 9, tag, 9

bind = SUPER+SHIFT, Z, toggleoverview

# floating resize only
bind = SUPER+ALT+SHIFT, left , resizewin, (-10,0)
bind = SUPER+ALT+SHIFT, right, resizewin, (+10,0)
bind = SUPER+ALT+SHIFT, up   , resizewin, (0,-10)
bind = SUPER+ALT+SHIFT, down , resizewin, (0,+10)

# resize windows for scroller mode
bind = SUPER+SHIFT,      S, switch_proportion_preset
bind = SUPER+CTRL,       S, spawn_shell, mmsg -s -d set_proportion,0.75
bind = SUPER+SHIFT+CTRL, S, spawn_shell, mmsg -s -d set_proportion,0.25

# volume / brightness
bind=NONE,XF86AudioRaiseVolume,spawn_shell,/home/almagest/.config/alma-scripts/VolumeBrightnessPlain.sh volume_up
bind=NONE,XF86AudioLowerVolume,spawn_shell,/home/almagest/.config/alma-scripts/VolumeBrightnessPlain.sh volume_down
bind=NONE,XF86AudioMute,spawn_shell,/home/almagest/.config/alma-scripts/VolumeBrightnessPlain.sh volume_mute
bind=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn_shell,/home/almagest/.config/alma-scripts/VolumeBrightnessPlain.sh brightness_up
bind=NONE,XF86MonBrightnessDown,spawn_shell,/home/almagest/.config/alma-scripts/VolumeBrightnessPlain.sh brightness_down

# media transport
bind = NONE, XF86AudioPrev , spawn_shell, playerctl previous
bind = NONE, XF86AudioNext , spawn_shell, playerctl next
bind = NONE, XF86AudioPause, spawn_shell, playerctl play-pause
bind = NONE, XF86AudioPlay , spawn_shell, playerctl play-pause

# mouse
mousebind = SUPER      , btn_left, moveresize, curmove
mousebind = SUPER+SHIFT, btn_left, moveresize, curresize

# 3-finger: Window focus
gesturebind = NONE, left , 3, viewtoright_have_client
gesturebind = NONE, right, 3, viewtoleft_have_client
gesturebind = SUPER, left , 3, tagtoright
gesturebind = SUPER, right, 3, tagtoleft
# gesturebind = NONE, up   , 3, focusdir,up
# gesturebind = NONE, down , 3, focusdir,down

# 4-finger: Workspace navigation
gesturebind = NONE, left , 4, viewtoright_have_client
gesturebind = NONE, right, 4, viewtoleft_have_client
gesturebind = SUPER, left , 4, tagtoright
gesturebind = SUPER, right, 4, tagtoleft
gesturebind = NONE, up   , 4, toggleoverview
gesturebind = NONE, down , 4, toggleoverview

# Window Rules
animation_type_open = fade
animation_type_close = fade
