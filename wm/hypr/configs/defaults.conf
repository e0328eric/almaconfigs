$filemanager = thunar
$applauncher = vicinae toggle
$terminal = ghostty
$browser = vivaldi --ozone-platform=wayland --enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL
$private_browser = vivaldi --ozone-platform=wayland --enable-features=VaapiVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL --incognito

# Screenshots
$shot-region = grimblast copy area
$shot-window = grimblast copy active
$shot-screen = grimblast copy outpuut
