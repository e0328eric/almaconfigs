[[language]]
name = "c"
indent = { tab-width = 4, unit = "    "}

[[language]]
name = "nasm"
scope = "source.asm"
file-types = ["asm"]
comment-token = ";"
roots = []

[[grammar]]
name = "nasm"
source = { git = "https://github.com/PictElm/tree-sitter-nasm", rev = "main" }

[[language]]
name = "nim"
scope = "source.nim"
injection-regex = "nim"
file-types = ["nim","nims"]
shebangs = ["nim"]
roots = []
comment-token = "#"
language-server = { command = "nimlsp" }
indent = { tab-width = 4, unit = " " }

[[grammar]]
name = "nim"
source = { git = "https://github.com/aMOPel/tree-sitter-nim", rev = "3727117e9a793610138ab0eabd75bef04c86299f" }

[[language]]
name = "typst"
scope = "source.typst"
injection-regex = "typst"
roots = []
comment-token = "//"
file-types = ["typ"]
indent = { tab-width = 2, unit = " " }
language-server = { command = "typst-lsp" }
text-width = 100
rulers = [100]
soft-wrap.wrap-at-text-width = true

[[grammar]]
name = "typst"
source = { git = "https://github.com/SeniorMars/tree-sitter-typst.git", rev = "main" }

[[language]]
name = "toml"
language-server = { command = "" }