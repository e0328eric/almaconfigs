[[language]]
name = "c"
indent = { tab-width = 4, unit = " " }
auto-format = true

[[language]]
name = "cpp"
indent = { tab-width = 4, unit = " " }
auto-format = true

[[language]]
name = "rust"
indent = { tab-width = 4, unit = " " }

[[language]]
name = "nasm"
scope = "source.asm"
file-types = ["asm"]
comment-token = ";"
roots = []

[[grammar]]
name = "nasm"
source = { git = "https://github.com/PictElm/tree-sitter-nasm", rev = "main" }

[[language]]
name = "nim"
scope = "source.nim"
injection-regex = "nim"
file-types = ["nim", "nims"]
shebangs = ["nim"]
roots = []
comment-token = "#"
language-servers = ["nimlsp"]

[[grammar]]
name = "nim"
source = { git = "https://github.com/alaviss/tree-sitter-nim.git", rev = "main" }

[[language]]
name = "typst"
scope = "source.typ"
roots = []
injection-regex = "typ(st)?"
comment-token = "//"
file-types = ["typ"]
indent = { tab-width = 4, unit = " " }
language-servers = ["typst-lsp"]
soft-wrap.wrap-at-text-width = true

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'$' = '$'
'"' = '"'

[[grammar]]
name = "typst"
source = { git = "https://github.com/uben0/tree-sitter-typst.git", rev = "master" }

[[language]]
name = "toml"
language-servers = []
