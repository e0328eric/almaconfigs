theme = "gruvbox"

[editor]
auto-pairs = false
line-number = "relative"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
g = { E = "goto_file_end" }
V = ["goto_line_start", "select_mode", "goto_line_end"]
Z = { Q = ":quit!", Z = ":write-quit" }

[keys.select]
g = { E = "goto_file_end" }