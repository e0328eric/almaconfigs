theme = "ayu_transparent"

[editor]
auto-pairs = false
line-number = "relative"
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[keys.normal]
G = "goto_file_end"
Z = { Q = ":quit!", Z = ":write-quit" }
V = "extend_line_below"
"space" = { c = ":format", b = "no_op" }
tab = "goto_next_buffer"
"C-tab" = "goto_previous_buffer"
"C-up" = "copy_selection_on_prev_line"
"C-down" = "copy_selection_on_next_line"
"C-left" = "goto_line_start"
"C-right" = "goto_line_end"
esc = ["collapse_selection", "keep_primary_selection"]

[keys.insert]
"C-left" = "goto_line_start"
"C-right" = "goto_line_end"

[keys.select]
g = { E = "goto_file_end" }
"C-left" = "goto_line_start"
"C-right" = "goto_line_end"

[keys.normal.x]
b = "buffer_picker"
d = ":buffer-close"
D = ":buffer-close!"
"left" = "goto_previous_buffer"
"right" = "goto_next_buffer"
