theme = "ayu_transparent"

[editor]
auto-pairs = false
line-number = "relative"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
g = { E = "goto_file_end" }
Z = { Q = ":quit!", Z = ":write-quit" }
"space" = { c = { f = ":format" }}
"C-up" = "copy_selection_on_prev_line"
"C-down" = "copy_selection_on_next_line"
"C-left" = "goto_line_start"
"C-right" = "goto_line_end"

[keys.select]
g = { E = "goto_file_end" }
