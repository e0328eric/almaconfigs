theme = "gruvbox"

[editor]
auto-pairs = false
line-number = "relative"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
0 = "goto_line_start"
V = "extend_line"
Z = { Q = ":quit!", Z = ":write-quit" }
"C-c" = "keep_primary_selection"
"C-/" = "toggle_comments"

[keys.insert]
"C-o" = "open_above"

[keys.select]
"C-semicolon" = "collapse_selection"
