theme = "monokai_pro_spectrum"

[editor]
auto-pairs = false
line-number = "relative"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.normal]
V = ["goto_line_start", "select_mode", "goto_line_end"]
Z = { Q = ":quit!", Z = ":write-quit" }
"C-c" = "keep_primary_selection"
"C-/" = "toggle_comments"

[keys.insert]
"C-o" = "open_above"

[keys.select]
"C-semicolon" = "collapse_selection"
