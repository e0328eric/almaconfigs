hide-cursor-when-typing = false
theme = "Hardcore"
working-dir = "C:/Users/almag"

[editor]
program = "nvim.exe"
args = []

# Fonts
[fonts]
size = 13
# extras = [{ family = "Microsoft JhengHei" }]
# features = ["ss02", "ss03", "ss05", "ss19"]

[fonts.regular]
family = "JetBrainsMono Nerd Font Mono"
style = "Normal"
weight = 400

[fonts.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Normal"
weight = 800

[fonts.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"
weight = 400

[fonts.bold-italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"
weight = 800

[shell]
program = "powershell.exe"
args = [
  "-NoExit",
  "-Command",
  "&{Import-Module \"\"\"C:\\Program Files\\Microsoft Visual Studio\\2022\\Community\\Common7\\Tools\\Microsoft.VisualStudio.DevShell.dll\"\"\"; Enter-VsDevShell 8b68ffab -SkipAutomaticLocation -DevCmdArguments \"\"\"-arch=x64 -host_arch=x64\"\"\"}; nu.exe",
]

[platform]
linux.shell.program = "/bin/fish"
macos.shell.program = "/bin/fish"
linux.working-dir = "~"
macos.working-dir = "~"

[platform.windows.bindings]
keys = [
  # remove default keybindings
  { key = "t", with = "control | shift", action = "none" },
  { key = "t", with = "control | shift", action = "none" },
]
