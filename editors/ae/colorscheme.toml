# ae color scheme (TOML)  -  sonokai "espresso" flavored
#
# These are flat "name = #rrggbb" entries. The syntax highlighter looks up a
# fixed set of names; any it cannot find falls back to a built-in default:
#
#   keyword              -> red
#   function / method    -> green
#   type                 -> blue
#   constant / number    -> purple
#   string               -> yellow
#   comment              -> grey
#   operator / attribute -> orange
#   variable             -> fg
#
# Load it from your config with:
#   ae.load_theme(ae.config_dir .. "colorscheme.toml")

bg     = "#312c2b"
fg     = "#e4d8c8"
red    = "#f86882"
orange = "#f08d71"
yellow = "#fdb760"
green  = "#a6cd77"
blue   = "#6db6c3"
purple = "#c79bf0"
grey   = "#8a857f"
